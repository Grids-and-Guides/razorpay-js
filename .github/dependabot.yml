version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore
    ignore:
      # typescript-eslint supports only TypeScript < 6.1. Remove once it supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types must match the oldest supported Node (CI tests 22 and 24). Bump when the Node range changes.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci
