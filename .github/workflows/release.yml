name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # push the version commit and tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # If unreleased changesets exist: opens/updates the "Version Packages" PR.
      # When that PR is merged: publishes the new versions to npm.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: publishing uses npm trusted publishing via the id-token permission.
