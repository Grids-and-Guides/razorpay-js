name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      - if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  package:
    name: Build & verify packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Validate exports and types (publint + arethetypeswrong)
        run: pnpm check:exports
      - name: Bundle size budget
        run: pnpm size

  changeset:
    name: Changeset present
    # Only feature PRs into develop need changesets; version PRs and develop -> main release PRs don't.
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.head_ref != 'changeset-release/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for a changeset when packages change
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^packages/.*/src/'; then
            pnpm changeset status --since=origin/${{ github.base_ref }}
          else
            echo "No package source changes; changeset not required."
          fi
